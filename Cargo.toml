[package]
name = "deleuze"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Append-only native event-content capture"

[features]
default = []
gates = ["dep:tokio", "dep:axum", "dep:http-body", "dep:tower-service"]

[dependencies]
blake3 = "=1.8.7"
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "http2", "tokio"] }
http-body = { version = "1", optional = true }
tower-service = { version = "0.3", optional = true }

[[example]]
name = "gates"
required-features = ["gates"]

[[example]]
name = "measure_gates"
required-features = ["gates"]
